<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olympic Grand Loop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f5f3ec;--ink:#1f2a22;--ink-2:#4a5a4e;--ink-3:#7a8a7d;--rule:#d8d6cb;--panel:#ecebe1;--moss:#2f6b45;--moss-soft:#dfeadf;--gold:#b8862b;--gold-soft:#f3e7c8;--slate:#4d6b8a;--rust:#a3512e;--rust-soft:#f3dfd5;--water:#cfdde3;--land:#e9e5d6;--shore:#b9c7cc;--park:#cddcc9;--park-edge:#5d8a66;--road:#8a7d66;--d1:#2f6b45;--d2:#b8862b;--d3:#4d6b8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a17;--ink:#e8e6dc;--ink-2:#b5bcb4;--ink-3:#7f8981;--rule:#2c342e;--panel:#1d2420;--moss:#7fbf93;--moss-soft:#213328;--gold:#e0b25a;--gold-soft:#3a3018;--slate:#8fb0d0;--rust:#e08a63;--rust-soft:#3a2418;--water:#1b262d;--land:#2a2f28;--shore:#3f4d52;--park:#2b3d30;--park-edge:#7fbf93;--road:#a09480;--d1:#7fbf93;--d2:#e0b25a;--d3:#8fb0d0}}
:root[data-theme="dark"]{--bg:#151a17;--ink:#e8e6dc;--ink-2:#b5bcb4;--ink-3:#7f8981;--rule:#2c342e;--panel:#1d2420;--moss:#7fbf93;--moss-soft:#213328;--gold:#e0b25a;--gold-soft:#3a3018;--slate:#8fb0d0;--rust:#e08a63;--rust-soft:#3a2418;--water:#1b262d;--land:#2a2f28;--shore:#3f4d52;--park:#2b3d30;--park-edge:#7fbf93;--road:#a09480;--d1:#7fbf93;--d2:#e0b25a;--d3:#8fb0d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 80px}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,8vw,44px);line-height:1.02}
h2{font-size:24px;margin:34px 0 10px;padding-top:14px;border-top:2px solid var(--ink)}
p{margin:0 0 10px}
.eyebrow{font:500 11.5px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
nav.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--rule)}
nav.tabs a{display:block;text-align:center;font:600 13px/1 "IBM Plex Sans",sans-serif;padding:11px 4px;border:1px solid var(--rule);border-radius:6px;color:var(--ink);text-decoration:none;background:var(--panel)}
nav.tabs a.d1{border-color:var(--d1)} nav.tabs a.d2{border-color:var(--d2)} nav.tabs a.d3{border-color:var(--d3)}
.sum{margin-top:16px;padding:14px 16px;background:var(--moss-soft);border-left:4px solid var(--moss);font-size:15.5px}
.sum b{font-weight:600}
.wx{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.wx .c{border:1px solid var(--rule);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.wx .d{font:500 11.5px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.wx .t{font-family:"Fraunces",serif;font-size:20px;margin-top:4px}
.wx .t.bad{color:var(--rust)} .wx .t.good{color:var(--moss)}
.wx .s{font-size:14px;color:var(--ink-2);grid-column:1/-1}
.wx .hi{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);text-align:right;line-height:1.6;white-space:nowrap}
.wxlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-block;font:600 13px/1 "IBM Plex Sans",sans-serif;padding:10px 12px;border-radius:20px;border:1.5px solid var(--slate);color:var(--slate);text-decoration:none;background:transparent}
.chip.alert{border-color:var(--rust);color:var(--rust)}
figure{margin:12px 0 0}
.map{width:100%;height:auto;display:block;border:1px solid var(--rule)}
.map text{font:15px "IBM Plex Sans",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.map .town circle{fill:var(--ink-3)} .map .town text,.map text.town{fill:var(--ink-2);font-size:13px}
.map .d1{stroke:var(--d1)} .map .d2{stroke:var(--d2)} .map .d3{stroke:var(--d3)}
.map .st circle{fill:var(--ink);stroke:var(--bg);stroke-width:2} .map .st .n{fill:var(--bg);stroke:none;font:700 13px "IBM Plex Mono",monospace} .map .st .lb{font-weight:600}
.map .fb circle{fill:var(--land);stroke:var(--rust);stroke-width:2.5;stroke-dasharray:3 2} .map .fb text{fill:var(--rust);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.day{margin-top:18px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;scroll-margin-top:70px}
.day header{padding:14px 16px 12px;background:var(--panel);border-left:5px solid var(--dc)}
.day header h2{border:0;margin:0;padding:0;font-size:24px}
.day header .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.day header .stat{font:12px/1.7 "IBM Plex Mono",monospace;color:var(--ink-3);margin-top:6px}
.day header .prog{font:500 12px "IBM Plex Mono",monospace;color:var(--dc);margin-top:6px}
.stop{display:grid;grid-template-columns:28px 1fr;gap:4px 12px;padding:12px 14px 12px 12px;border-top:1px solid var(--rule);align-items:start}
.stop.done{opacity:.55}
.stop.done .title{text-decoration:line-through}
.chk{width:26px;height:26px;margin:1px 0 0;accent-color:var(--dc);cursor:pointer}
.stop .t{font:500 12.5px/1 "IBM Plex Mono",monospace;color:var(--dc);margin-bottom:4px;letter-spacing:.02em}
.stop .title{font-weight:600;font-size:16px}
.stop .why{font-size:14px;color:var(--ink-2);margin-top:3px}
.stop .why b{color:var(--ink);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:6px;font:600 14px/1 "IBM Plex Sans",sans-serif;text-decoration:none;background:var(--dc);color:var(--bg)}
.btn.o{background:transparent;color:var(--dc);border:1.5px solid var(--dc)}
.gday{display:block;text-align:center;margin:12px 14px 14px;padding:13px;border-radius:6px;border:1.5px solid var(--dc);color:var(--dc);font:600 14px/1 "IBM Plex Sans",sans-serif;text-decoration:none}
.fall{margin:0 14px 14px;padding:10px 12px;background:var(--rust-soft);border-left:3px solid var(--rust);font-size:13.5px;color:var(--ink)}
.fall a{color:var(--rust);font-weight:600}
.d1{--dc:var(--d1)} .d2{--dc:var(--d2)} .d3{--dc:var(--d3)}
details{border-top:1px solid var(--rule);padding:12px 0}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{font-weight:600;cursor:pointer;padding:4px 0;font-size:16px;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-family:"IBM Plex Mono",monospace;color:var(--ink-3)}
details[open] summary::after{content:"−"}
details p,details li{font-size:14.5px;color:var(--ink-2)}
details ul{margin:6px 0 0;padding-left:18px}
details li{margin-bottom:4px}
details a{color:var(--slate)}
.reset{margin-top:24px;font:500 12.5px "IBM Plex Mono",monospace;color:var(--ink-3);background:none;border:1px solid var(--rule);padding:8px 12px;border-radius:6px;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (min-width:560px){.wx{grid-template-columns:repeat(3,1fr)} .wx .s{grid-column:auto} .wx .c{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.ro{font:500 12px "IBM Plex Mono",monospace;color:var(--ink-3);margin-top:6px}
.saving{font:500 12px "IBM Plex Mono",monospace;color:var(--gold)}
</style>

   "html": "<p>America the Beautiful covers park entry (normally $30 per car) and Forest Service trailheads. It does not cover Washington DNR land, so Sunday night needs a Discover Pass on the dash: $11 day or $30 annual at <a href=\"https://discoverpass.wa.gov\">discoverpass.wa.gov<\/a>. It also does not waive campground fees. Kiosks and the park entrance are card only. Second Beach parking is $10 cash or card to the Quileute Tribe.<\/p>"

      var done=d.stops.filter(function(s){return isDone(s.id)}).length;
      h+='<section class="day '+d.cls+'" id="'+d.id+'"><header><h2>'+esc(d.title)+'</h2><div class="sub">'+esc(d.sub)+'</div><div class="stat">'+esc(d.stat)+'</div><div class="prog">'+(done===d.stops.length?'Day complete':done+' of '+d.stops.length+' stops done')+'</div></header>';

        if(s.nav){h+='<div class="btns"><a class="btn" href="'+esc(apple(s.nav))+'">Apple Maps</a>'+(s.google!==false?'<a class="btn o" href="'+esc(google(s.nav))+'">Google</a>':'')+'</div>'}

  function toggle(id,on){

  }
  function commit(nextChecks){
    if(readOnly||!artifactNs){ local=nextChecks; try{localStorage.setItem(LS,JSON.stringify(local))}catch(e){} render(); return; }
    if(saving) return; saving=true;
    var d=JSON.parse(JSON.stringify(data)); d.checks=nextChecks;
    data.checks=nextChecks; render();

      document.getElementById('status').textContent='Could not sync ('+(e&&e.code||'error')+'). Checkmark kept on this phone.';
      local=nextChecks; try{localStorage.setItem(LS,JSON.stringify(local))}catch(x){}
    });
  }

  render();
  if(window.claude&&window.claude.use){
    window.claude.use('artifact').then(function(ns){ if(ns){artifactNs=ns;} else {readOnly=true;} render(); });
  } else { readOnly=true; render(); }
})();
</script>
